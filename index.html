<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AgroLineAge : Family Livestock Tree</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f4a37" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="shortcut icon" href="src/img/logo/DA SAAD LOGO FULL - WHITE TEXT.png" type="image/x-icon" />
    <script src="src/js/config.js"></script>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
    <link rel="stylesheet" href="src/css/style.css" />
  </head>
  <body>
    <header class="top">
      <div><b>🌿 AgroLineAge</b><small>Livestock Farmer Family Tree</small></div>
      <span class="sp"></span>
      <span id="net"><i></i><span>Online</span></span>
      <button id="ob" onclick="toggleOffline()" title="Pause or resume Google Drive sync">Work offline</button>
      <div id="usr"></div>
      <button id="gb" class="p" onclick="signIn()">Sign in with Google</button>
      <button id="gx" onclick="signOut()" hidden>Sign out</button>
    </header>

    <div class="bar">
      <div class="g">
        <select id="vw" onchange="view=this.value;focus=null;render(true)" title="View">
          <option value="l">Lineage view</option>
          <option value="o">Organization view</option>
        </select>
        <select id="fo" onchange="orgF=this.value;focus=null;render(true)" title="Organization filter"></select>
        <input id="q" placeholder="Search tag, farmer, org" style="width:170px" list="dl" /><datalist id="dl"></datalist>
      </div>
      <div class="g">
        <button onclick="zoomBy(1/1.2)" title="Zoom out">－</button><span id="zp">100%</span><button onclick="zoomBy(1.2)" title="Zoom in">＋</button>
        <button onclick="fit()">Fit</button>
        <button onclick="resetLayout()" title="Undo card dragging">Reset layout</button>
        <label class="ck"><input type="checkbox" id="db" /> Drag whole branch</label>
      </div>
      <div class="g">
        <button onclick="setAll(false)">Expand all</button><button onclick="setAll(true)">Collapse all</button>
      </div>
      <div class="g">
        <button onclick="orgDlg()">🏢 Organizations</button>
        <button onclick="editF()">+ Farmer</button><button class="p" onclick="editA()">+ Animal</button>
      </div>
      <div class="g">
        <button onclick="exportDlg()">Export</button><button onclick="$('f').click()">Import</button>
        <input type="file" id="f" accept=".xlsx,.xls,.csv" hidden />
      </div>
      <span id="st"></span>
    </div>
    <div id="bc"></div>

    <main>
      <div id="cv">
        <div id="wd"><svg id="ed" width="1" height="1"></svg><div id="nd"></div></div>
      </div>
      <aside id="side"></aside>
    </main>
    <dialog id="dm"></dialog>
    <dialog id="dg"></dialog>
    <script src="src/js/app.js"></script>
  </body>
</html>
