<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AgroLineAge : Family Livestock Tree</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="shortcut icon"
      href="src/uploads/logo/DA SAAD LOGO FULL - WHITE TEXT.png"
      type="image/x-icon"
    />
    <script src="src/js/config.js"></script>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
    <link rel="stylesheet" href="src/css/style.css" />
  </head>
  <body>
    <header>
      <b>🐖 Livestock Tree</b>
      <select
        id="vw"
        onchange="
          view = this.value;
          focus = null;
          render();
        "
      >
        <option value="l">Lineage view</option>
        <option value="o">Organization view</option>
      </select>
      <input
        id="q"
        placeholder="Search tag, ID, farmer"
        style="width: 160px"
        list="dl"
      /><datalist id="dl"></datalist> <button onclick="zoom(0.1)">＋</button
      ><button onclick="zoom(-0.1)">－</button
      ><button onclick="fit()">Fit</button>
      <button onclick="setAll(false)">Expand all</button
      ><button onclick="setAll(true)">Collapse all</button>
      <button onclick="editF()">+ Farmer</button
      ><button onclick="editA()">+ Animal</button>
      <button onclick="exportDlg()">Export</button
      ><button onclick="$('f').click()">Import</button
      ><input type="file" id="f" accept=".xlsx,.csv" hidden />
      <button id="gb" class="p" onclick="signIn()">Sign in with Google</button
      ><span id="st"></span>
    </header>
    <div id="bc"></div>
    <main>
      <div id="cv">
        <div id="tr" class="tree" style="transform-origin: 0 0"></div>
      </div>
      <aside id="side"></aside>
    </main>
    <dialog id="dg"></dialog>
    <script src="src/js/app.js"></script>
  </body>
</html>
